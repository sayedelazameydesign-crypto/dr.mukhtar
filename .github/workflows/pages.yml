name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Workflow + secrets contract
        run: node scripts/check-workflows.js

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.css app.js brand.svg manifest.webmanifest _site/
          cp -r assets _site/

      - name: Verify backend simulation
        run: node scripts/test-gas-simulated.js

      - name: Verify LLM adapter + config
        run: node scripts/test-llm-adapter.js

      - name: Guard against localhost and external font CDNs
        run: |
          if grep -rn "http://localhost\|127.0.0.1\|fonts.googleapis\|fonts.gstatic" _site; then
            echo "Shipped pages must stay self-contained."
            exit 1
          fi

      - name: Verify Apps Script bundle builds
        run: python3 scripts/build-gas-package.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
