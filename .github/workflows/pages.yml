name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A feature branch touching the deploy wiring must prove it still runs —
  # otherwise a broken pages.yml is only discovered after merge.
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/check-workflows.js'
      - 'scripts/enable-pages.sh'
      - 'docs/publish.md'

permissions:
  contents: read
  # pages: write / id-token: write live on the deploy job only — the build job
  # reads the tree and produces an artifact, it has no business holding the
  # deployment credential (least privilege; zizmor: excessive-permissions).
  # NOTE: "administration" is NOT a valid permissions key (GitHub rejects the
  # whole workflow with "Unexpected value 'administration'"). Creating the Pages
  # site needs an OWNER PAT with Administration+Pages write, passed to the
  # enablement step below — GITHUB_TOKEN can never do it.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages needs pages: write (metadata-only on PRs it does not run);
      # the deployment credential id-token stays on the deploy job exclusively.
      pages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Workflow + secrets contract
        run: node scripts/check-workflows.js

      - name: Assemble static site
        run: |
          # Allow-list, not a deny-list: everything in the repository is internal by
          # default, and only files named here reach the public site. A deny-list silently
          # publishes whatever is added later — terminal transcripts, backend sources,
          # build scripts — which is exactly what had been happening.
          mkdir -p _site assets
          cp index.html privacy.html app.css app.js brand.svg manifest.webmanifest \
             robots.txt sitemap.xml 404.html clinic.json _site/
          # Evidence Lab — generated, self-contained, safe to publish (approved for the public site)
          cp -r evidence/ _site/evidence/
          # No masking: a missing assets/ used to publish a site with no fonts and no error.
          cp -r assets/. _site/assets/
          echo "--- published files:"
          find _site -type f | sort

      - name: Verify backend simulation
        run: node scripts/test-gas-simulated.js

      - name: Verify LLM adapter + config
        run: node scripts/test-llm-adapter.js

      - name: Guard against localhost and external font CDNs
        run: |
          if grep -rn "http://localhost\|127.0.0.1\|fonts.googleapis\|fonts.gstatic" _site; then
            echo "Shipped pages must stay self-contained."
            exit 1
          fi

      # The release gate reads the same clinic.json the page reads. In demo mode it passes
      # only because the badge is visible; with demoMode removed it refuses to publish until
      # the clinic name, phone, doctor and licence are all present and valid.
      - name: Clinic data gate (demo with badge, or complete for production)
        run: node scripts/clinic-ready.js

      - name: Verify Apps Script bundle builds
        run: python3 scripts/build-gas-package.py

      # A pushed branch cannot deploy before the site exists, and configure-pages
      # only says "Not Found". Fail with the exact fix instead (docs/publish.md §2).
      - name: Explain the fix when Pages is not enabled yet
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PAGES_AUTO_ENABLE: ${{ vars.PAGES_AUTO_ENABLE }}
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "Pages site exists — continuing."
            exit 0
          fi
          if [ "$(printf '%s' "${PAGES_AUTO_ENABLE:-}")" = 'true' ]; then
            echo "Pages missing but PAGES_AUTO_ENABLE=true — the owner-PAT step below creates it."
            exit 0
          fi
          echo "::error title=Pages is not enabled::Open $GITHUB_SERVER_URL/$REPO/settings/pages → Build and deployment → Source: GitHub Actions, then re-run this job. Or run: sh scripts/enable-pages.sh"
          exit 1

      # On a pull request the Pages site may not exist yet, and a PR has no
      # business creating it: the check is the build itself (see docs/publish.md).
      - name: Create the Pages site (owner PAT, only when asked to)
        if: ${{ vars.PAGES_AUTO_ENABLE == 'true' && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN }}

      # Metadata only: needs no existing site, so a PR build stays meaningful.
      # configure-pages fails outright when the repository has no Pages site —
      # verified on a PR too — so it never runs there. A PR proves the build
      # (assembly, simulation, adapter, bundle, artifact) and stops.
      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    # Never deploy from a pull request: build-only there (deploy needs the
    # github-pages environment and must stay a main-branch concern).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
