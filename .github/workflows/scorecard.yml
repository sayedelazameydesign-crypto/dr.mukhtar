name: Scorecard

# OpenSSF Scorecard — weekly supply-chain health score of this repository
# (branch protection, token permissions, dangerous workflows, pinned deps, …).
# Free for public repositories. Results are published to the Scorecard API
# (api.scorecard.dev) to power the badge/viewer, and mirrored to
# Security → Code scanning. Publishing needs the OIDC token (id-token: write);
# nothing else does, so contents stay read-only except inside the job.
#
# Runs on the default branch only (push to main + schedule), as designed upstream.

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 5 * * 3' # Wednesdays 05:27 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write # OIDC, for publish_results — carries no repository credential
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
