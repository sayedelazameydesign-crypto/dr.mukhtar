name: Deploy to Apps Script

# Manual only, on purpose: publishing is a decision, never a side effect of a push.
# It pushes this repository's gas/ bundle and repoints the EXISTING web-app deployment,
# so the URL already shared with the clinic keeps working. Free: Apps Script is inside
# the Google quota and clasp is open source — no billing account is involved.

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Version label (kept in the Apps Script version history)'
        required: true
        default: 'Celia Kids — publish'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build and validate Apps Script bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
      source_sha: ${{ steps.bundle.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build the Apps Script bundle
        run: python3 scripts/build-gas-package.py

      - name: Sanity-check the bundle before it can reach the clinic
        run: |
          test -s gas/Index.html || { echo '::error::gas/Index.html is missing or empty'; exit 1; }
          test -s gas/appsscript.json || { echo '::error::gas/appsscript.json is missing'; exit 1; }
          for marker in 'id="bookingForm"' 'id="trackForm"' 'id="staffDashboard"' 'quiet-tools'; do
            grep -q -- "$marker" gas/Index.html || { echo "::error::the bundle lost $marker — refusing to publish"; exit 1; }
          done
          echo "Bundle verified: booking form, tracking, staff board and quiet tools are all present."
          du -sh gas | awk '{print "Bundle size: " $1}'

      - name: Require the main branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$SOURCE_REF" = refs/heads/main || { echo '::error::Production deployments must originate from main.'; exit 1; }

      - name: Validate version label
        env:
          LABEL: ${{ inputs.label }}
        run: |
          test -n "$LABEL" || { echo '::error::Version label is empty.'; exit 1; }
          case "$LABEL" in *$'\n'*|*$'\r'*) echo '::error::Version label must be a single line.'; exit 1;; esac

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Install test dependencies
        run: npm ci

      - name: Run gates and tests
        run: |
          npm run gates
          npm test

      - name: Package and fingerprint the validated bundle
        id: bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -czf gas-bundle.tar.gz gas/
          echo "sha256=$(sha256sum gas-bundle.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload validated bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gas-bundle-${{ github.sha }}
          path: gas-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Push bundle and update the live URL
    needs: build-and-validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download validated bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gas-bundle-${{ github.sha }}

      - name: Verify bundle provenance and integrity
        env:
          EXPECTED_SHA: ${{ needs.build-and-validate.outputs.bundle_sha256 }}
          SOURCE_SHA: ${{ needs.build-and-validate.outputs.source_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          test "$SOURCE_SHA" = "$RUN_SHA" || { echo '::error::Bundle source does not match this workflow run.'; exit 1; }
          printf '%s  %s\n' "$EXPECTED_SHA" gas-bundle.tar.gz | sha256sum --check
          tar -xzf gas-bundle.tar.gz

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Confirm both identifiers are configured
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$GAS_SCRIPT_ID" ]; then
            echo '::error::Add repository variable GAS_SCRIPT_ID. Copy it from Apps Script -> Project Settings -> Script ID. The id inside the /exec URL is a deployment id, not this value.'
            exit 1
          fi
          if [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo '::error::Add repository variable GAS_DEPLOYMENT_ID. It is the id inside the published /exec URL (AKfycb...).'
            exit 1
          fi
          echo "Both identifiers are present. Values are not printed."

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo '::error::Add repository secret CLASPRC_JSON (contents of ~/.clasprc.json after clasp login).'
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "Credentials file written (mode 600). Contents never logged."

      - name: Bind this folder to the Apps Script project
        env:
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
        run: printf '{"scriptId":"%s","rootDir":"gas"}\n' "$GAS_SCRIPT_ID" > .clasp.json

      - name: Preflight — resolve the project and the target deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
        run: |
          set -o pipefail
          OUT=$(npx --yes @google/clasp@2.4.2 deployments 2>&1) || {
            echo '::error::clasp could not list deployments. The credentials or the Script ID are wrong; nothing was pushed.'
            printf '%s\n' "$OUT" | sed -E 's/(access_token|refresh_token|id_token)[^,]*/\1=[redacted]/g' | head -20
            exit 1
          }
          printf '%s\n' "$OUT"
          printf '%s' "$OUT" | grep -q "$GAS_DEPLOYMENT_ID" || {
            echo '::error::That deployment id does not belong to this project. Fix GAS_DEPLOYMENT_ID; nothing was pushed.'
            exit 1
          }
          echo 'Target deployment confirmed on the declared project.'

      - name: Push gas/ to the project
        run: npx --yes @google/clasp@2.4.2 push --force

      - name: Create a version and update the live deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          LABEL: ${{ inputs.label }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test -n "$LABEL" || { echo '::error::Version label is empty.'; exit 1; }
          case "$LABEL" in *$'\n'*|*$'\r'*) echo '::error::Version label must be a single line.'; exit 1;; esac
          npx --yes @google/clasp@2.4.2 deploy \
            --deploymentId "$GAS_DEPLOYMENT_ID" \
            --description "$LABEL (run $RUN_ID attempt $RUN_ATTEMPT)"

      - name: Verify the updated deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID }}
          LABEL: ${{ inputs.label }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          npx --yes @google/clasp@2.4.2 deployments | grep -F -- "$GAS_DEPLOYMENT_ID" | grep -F -- "$LABEL (run $RUN_ID attempt $RUN_ATTEMPT)" || {
            echo '::error::The target deployment with the requested label was not found after publishing.'
            exit 1
          }

      - name: Remove the credentials file
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
